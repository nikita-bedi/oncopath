name: Test and deploy to Render

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  test:
    name: Safety and regression tests
    runs-on: ubuntu-latest
    env:
      FHIR_LAB_REMOTE_ENABLED: "false"
      BETWEEN_VISITS_LLM_PROVIDER: rules
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  deploy:
    name: Trigger Render deploy hook
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Explain missing deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::warning::Add RENDER_DEPLOY_HOOK_URL under repository Settings > Secrets and variables > Actions, then run this workflow again."
      - name: Deploy the exact tested commit
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        shell: bash
        run: |
          separator='?'
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]]; then separator='&'; fi
          response=$(curl --fail-with-body --silent --show-error \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}")
          echo "Render accepted deploy for commit ${GITHUB_SHA}."
          if [[ -n "$response" ]]; then
            python -c 'import json,sys; data=json.load(sys.stdin); print("Deploy ID:", data.get("deploy", {}).get("id") or data.get("id") or "queued")' <<< "$response"
          else
            echo "Deploy queued behind an in-progress deploy."
          fi
